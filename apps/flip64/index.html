<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f1">
  <title>Flip64 黑白棋</title>
  <style>
    :root{color-scheme:light;--ink:#111;--paper:#f8f7f1;--red:#e72b2e;--blue:#064cc5;--yellow:#ffda00;--line:4px;font-family:system-ui,"Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-width:320px;color:var(--ink);background:#efece1 url("./flip64-background.svg") center / 100% 100% fixed no-repeat}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background:rgba(252,251,247,.10);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
    .shell{position:relative;width:min(100% - 24px,740px);margin:0 auto;padding:22px 0 34px}.back{display:inline-block;background:var(--paper);border:3px solid var(--ink);padding:7px 12px;color:var(--ink);font-size:14px;font-weight:800;text-decoration:none;margin-bottom:12px}.back:hover{text-decoration:underline}
    .hero{display:grid;grid-template-columns:16px 1fr 96px;gap:var(--line);background:var(--ink);border:var(--line) solid var(--ink);margin-bottom:12px}.hero::before{content:"";background:var(--red)}.hero-copy{background:var(--paper);padding:18px clamp(14px,3vw,28px)}.eyebrow{margin:0 0 5px;color:var(--blue);font-weight:900;font-size:12px;letter-spacing:.17em}.hero h1{margin:0;font-size:clamp(31px,6.6vw,55px);line-height:1.05;letter-spacing:-.05em}.hero p:last-child{margin:7px 0 0;font-size:14px;color:#444}.hero-art{display:grid;grid-template-columns:62% 1fr;grid-template-rows:34% 1fr;gap:4px;background:var(--ink)}.hero-art i{background:var(--yellow)}.hero-art i:nth-child(2){background:var(--blue)}.hero-art i:nth-child(3){background:var(--paper)}.hero-art i:nth-child(4){background:var(--ink)}
    .game{background:var(--paper);border:var(--line) solid var(--ink);padding:clamp(10px,2.4vw,20px)}.scores{display:grid;grid-template-columns:1fr 1fr;gap:var(--line);background:var(--ink);border:var(--line) solid var(--ink)}.score{display:flex;align-items:center;gap:12px;min-width:0;padding:10px 14px;background:var(--paper)}.score.white{background:var(--yellow)}.score.active{box-shadow:inset 7px 0 0 var(--red)}.score.white.active{box-shadow:inset 7px 0 0 var(--blue)}.score .disc{width:31px;height:31px;flex:none}.score-label{font-size:13px;font-weight:800}.score strong{font-size:clamp(23px,4vw,35px);font-variant-numeric:tabular-nums;margin-left:auto}.disc{display:block;width:75%;height:75%;border-radius:50%;background:#111;border:2px solid #111;box-shadow:inset -3px -4px 0 #3a3a3a,2px 3px 0 #0003}.disc.white-disc{background:#fff;box-shadow:inset -3px -4px 0 #d7d7d7,2px 3px 0 #0003}
    .turn{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;margin:10px 0;padding:8px 12px;background:var(--blue);color:white;border:3px solid var(--ink);font-size:15px;font-weight:850}.turn small{font-size:12px;font-weight:700;text-align:right}.turn.finished{background:var(--red)}
    .board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));aspect-ratio:1;background:var(--ink);border:4px solid var(--ink);gap:2px;touch-action:manipulation}.square{min-width:0;min-height:0;padding:0;border:0;background:#efede5;display:grid;place-items:center;position:relative}.square:nth-child(16n + 2),.square:nth-child(16n + 4),.square:nth-child(16n + 6),.square:nth-child(16n + 8),.square:nth-child(16n + 9),.square:nth-child(16n + 11),.square:nth-child(16n + 13),.square:nth-child(16n + 15){background:#e2e0d6}.square.legal{cursor:pointer}.square.legal::after{content:"";position:absolute;inset:50% auto auto 50%;width:21%;aspect-ratio:1;border-radius:50%;background:var(--blue);transform:translate(-50%,-50%) scale(1);transition:transform .12s;pointer-events:none}.square.legal:hover::after,.square.legal:focus-visible::after{transform:translate(-50%,-50%) scale(2.24)}.square.preview-flip{background:var(--yellow)}.square:not(.legal){cursor:default}.square.last{outline:4px solid var(--red);outline-offset:-5px}.square:focus-visible{outline:4px solid var(--blue);outline-offset:-5px;z-index:1}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{border:3px solid var(--ink);padding:10px 15px;background:var(--yellow);font-size:14px;font-weight:850}.actions button:hover:not(:disabled){background:var(--red);color:white}.actions button.secondary{background:white}.actions button:disabled{opacity:.4;cursor:default}.note{border-left:4px solid var(--ink);margin:16px 2px 0;padding-left:12px;font-size:14px;line-height:1.55}.note strong{color:var(--blue)}.stripe{height:18px;border:3px solid var(--ink);margin-top:12px;background:linear-gradient(90deg,#111 0 15%,var(--red) 15% 42%,#111 42% calc(42% + 3px),var(--yellow) calc(42% + 3px) 57%,#111 57% calc(57% + 3px),var(--blue) calc(57% + 3px))}
    .dashboard{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.55fr) minmax(0,.9fr) 54px;gap:4px;min-height:106px;padding:4px;margin-bottom:12px;background:var(--ink)}.dashboard .scores{grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:4px;border:0;min-width:0}.dashboard .score{padding:5px 9px;gap:8px}.dashboard .score .disc{width:25px;height:25px}.dashboard .score strong{font-size:27px}.dashboard .turn{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;min-height:0;margin:0;padding:7px 9px;border:0;text-align:center;font-size:clamp(15px,2.3vw,22px)}.dashboard .turn small{font-size:12px;text-align:center}.dashboard .actions{display:grid;grid-template-rows:1fr 1fr;gap:4px;margin:0}.dashboard .actions button{min-width:0;width:100%;padding:4px 5px;border:0;background:var(--red);color:#fff;font-size:13px}.dashboard .actions button:hover:not(:disabled){background:#ad1118}.dashboard .actions button.secondary{background:var(--paper);color:var(--ink)}.dashboard .actions button.secondary:hover:not(:disabled){background:var(--yellow);color:var(--ink)}.dashboard .actions button:disabled{opacity:.68}.help-button{border:0;background:var(--yellow);color:var(--ink);font-size:35px;font-weight:900}.help-button:hover{background:#f1c900}
    dialog{border:4px solid var(--ink);padding:0;width:min(90vw,440px);color:var(--ink);background:var(--paper);box-shadow:12px 12px 0 #1115}dialog::backdrop{background:#1119}dialog header{background:var(--red);color:#fff;padding:15px 20px;font-size:22px;font-weight:900}dialog .body{padding:18px 20px 22px;font-size:15px;line-height:1.65}dialog .body p{margin:0 0 10px}dialog .body ol{margin:0 0 18px;padding-left:23px}dialog .body button{width:100%;border:3px solid var(--ink);background:var(--yellow);padding:10px;font-weight:850}
    @media(max-width:540px){.shell{width:min(100% - 14px,740px);padding-top:10px}.hero{grid-template-columns:10px 1fr 62px}.hero-copy{padding:13px}.hero p:last-child{font-size:12px}.dashboard{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,.9fr) 34px;min-height:82px;gap:3px;padding:3px}.dashboard .scores,.dashboard .actions{gap:3px}.dashboard .score{gap:4px;padding:3px 5px}.dashboard .score .disc{width:19px;height:19px}.dashboard .score-label{display:none}.dashboard .score strong{font-size:20px}.dashboard .turn{font-size:12px;padding:3px;gap:3px}.dashboard .turn small{font-size:10px}.dashboard .actions button{font-size:10px;padding:2px}.help-button{font-size:28px}.board{gap:1px;border-width:3px}.square.last{outline-width:3px;outline-offset:-3px}}
  </style>
</head>
<body>
  <main class="shell">
    <a class="back" href="/play/">← 返回小游戏</a>
    <header class="hero"><div class="hero-copy"><p class="eyebrow">LOCAL / TWO PLAYERS</p><h1>Flip64 黑白棋</h1><p>同一设备，两人轮流对弈。</p></div><div class="hero-art" aria-hidden="true"><i></i><i></i><i></i><i></i></div></header>
    <section class="game" aria-label="黑白棋游戏">
      <div class="dashboard">
        <div class="scores" aria-label="棋子数目"><div class="score black active" id="black-score"><span class="disc" aria-hidden="true"></span><span class="score-label">黑棋</span><strong id="black-count" aria-label="黑棋数目">2</strong></div><div class="score white" id="white-score"><span class="disc white-disc" aria-hidden="true"></span><span class="score-label">白棋</span><strong id="white-count" aria-label="白棋数目">2</strong></div></div>
        <div class="turn" id="turn" role="status" aria-live="polite"><span id="turn-text">黑棋先手</span><small id="move-count">第 1 回合</small></div>
        <div class="actions"><button id="restart" type="button">重新开局</button><button id="undo" class="secondary" type="button" disabled>悔一步</button></div>
        <button id="help" class="help-button" type="button" aria-label="玩法说明">?</button>
      </div>
      <div class="board" id="board" role="grid" aria-label="8 乘 8 黑白棋棋盘"></div>
      <p class="note"><strong>蓝点</strong>表示当前可落子的位置。鼠标悬浮在蓝点上，黄色格子会标出即将翻转的棋子；无棋可下时自动跳过。</p>
    </section>
    <div class="stripe" aria-hidden="true"></div>
  </main>
  <dialog id="help-dialog"><header>黑白棋玩法</header><div class="body"><ol><li>黑棋先手，两人轮流落子。</li><li>新棋子与己方棋子在横、竖或斜线上夹住对方棋子，夹住的棋子就会翻面。</li><li>每一步必须至少翻转一枚棋子，蓝点就是可以落子的位置。</li><li>一方无合法落点时自动跳过；双方都无落点时结束，多子的一方获胜。</li></ol><form method="dialog"><button>知道了</button></form></div></dialog>
  <dialog id="result-dialog"><header id="result-title">对局结束</header><div class="body"><p id="result-text"></p><form method="dialog"><button>查看棋盘</button></form></div></dialog>
  <script>
    (()=>{
      const N=8, BLACK=1, WHITE=-1, dirs=[-1,0,1].flatMap(y=>[-1,0,1].filter(x=>x||y).map(x=>[x,y]));
      const $=id=>document.getElementById(id); let board,turn,moves,history,last,notice,done;
      const inside=(x,y)=>x>=0&&x<N&&y>=0&&y<N;
      function flips(b,x,y,side){if(b[y*N+x]!==0)return[];const all=[];for(const [dx,dy] of dirs){const line=[];let cx=x+dx,cy=y+dy;while(inside(cx,cy)&&b[cy*N+cx]===-side){line.push(cy*N+cx);cx+=dx;cy+=dy}if(line.length&&inside(cx,cy)&&b[cy*N+cx]===side)all.push(...line)}return all}
      function legal(b,side){const out=new Map();for(let y=0;y<N;y++)for(let x=0;x<N;x++){const f=flips(b,x,y,side);if(f.length)out.set(y*N+x,f)}return out}
      function score(){return {black:board.filter(x=>x===BLACK).length,white:board.filter(x=>x===WHITE).length}}
      function start(){board=Array(64).fill(0);board[3*N+3]=WHITE;board[3*N+4]=BLACK;board[4*N+3]=BLACK;board[4*N+4]=WHITE;turn=BLACK;moves=0;history=[];last=-1;notice='';done=false;render()}
      function place(i){if(done)return;const f=legal(board,turn).get(i);if(!f)return;history.push({board:[...board],turn,moves,last,notice,done});board[i]=turn;for(const j of f)board[j]=turn;last=i;moves++;turn=-turn;notice='';let options=legal(board,turn);if(!options.size){const waiting=turn;turn=-turn;options=legal(board,turn);if(options.size)notice=`${waiting===BLACK?'黑':'白'}棋无处可下，已自动跳过。`;else{done=true;notice='双方都没有合法落点，对局结束。'}}render();if(done)$('result-dialog').showModal()}
      function render(){const s=score(),options=done?new Map():legal(board,turn);$('black-count').textContent=s.black;$('white-count').textContent=s.white;$('black-score').classList.toggle('active',!done&&turn===BLACK);$('white-score').classList.toggle('active',!done&&turn===WHITE);$('turn').classList.toggle('finished',done);$('move-count').textContent=`已落子 ${moves} 步`;$('undo').disabled=!history.length;
        if(done){const winner=s.black===s.white?'平局':s.black>s.white?'黑棋获胜':'白棋获胜';$('turn-text').textContent=`${winner} · 黑 ${s.black} : 白 ${s.white}`;$('result-title').textContent=winner;$('result-text').textContent=`最终比分：黑棋 ${s.black}，白棋 ${s.white}。`;}
        else $('turn-text').textContent=`轮到${turn===BLACK?'黑':'白'}棋${notice?' · '+notice:''}`;
        const preview=i=>{for(const cell of $('board').children)cell.classList.remove('preview-flip');for(const j of options.get(i)||[])$('board').children[j].classList.add('preview-flip')};
        const frag=document.createDocumentFragment();for(let i=0;i<64;i++){const el=document.createElement('button'),x=i%N,y=Math.floor(i/N),v=board[i];el.type='button';el.className='square'+(options.has(i)?' legal':'')+(i===last?' last':'');el.setAttribute('role','gridcell');el.setAttribute('aria-label',`${String.fromCharCode(65+x)}${y+1}，${v===BLACK?'黑棋':v===WHITE?'白棋':options.has(i)?'可落子':'空格'}`);el.setAttribute('aria-disabled',String(!options.has(i)));el.tabIndex=options.has(i)?0:-1;if(v){const disc=document.createElement('span');disc.className='disc'+(v===WHITE?' white-disc':'');disc.setAttribute('aria-hidden','true');el.append(disc)}if(options.has(i)){el.addEventListener('pointerenter',()=>preview(i));el.addEventListener('pointerleave',()=>preview(-1));el.addEventListener('focus',()=>preview(i));el.addEventListener('blur',()=>preview(-1))}el.addEventListener('click',()=>place(i));frag.append(el)}$('board').replaceChildren(frag)}
      $('restart').addEventListener('click',start);$('undo').addEventListener('click',()=>{const h=history.pop();if(!h)return;({board,turn,moves,last,notice,done}=h);render()});$('help').addEventListener('click',()=>$('help-dialog').showModal());start();
    })();
  </script>
</body>
</html>
