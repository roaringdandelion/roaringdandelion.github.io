<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>时序 · AI时间线生成器</title><link rel="stylesheet" href="style.css"><body><header><b>◷ 时序 <small>TIMELINE STUDIO</small></b><span>V3 · 智能文本解析</span></header><main><a class="site-back" href="../../tools/">← 返回小工具</a><div class="workspace"><aside><h2>01 / 输入你的故事</h2><label for="title">时间线标题</label><input id="title" value="第二次世界大战 · 关键节点"><label for="source">包含日期的文本</label><textarea id="source">1939年9月1日，德国入侵波兰，第二次世界大战爆发。1941年12月7日，日本袭击珍珠港，美国加入战争。1945年5月8日，德国宣布投降。1945年9月2日，日本正式签署投降书，第二次世界大战结束。</textarea><p class="hint">支持中文年月日、YYYY-MM-DD、公元前日期，可精确到小时和分钟。例如：2026年10月20日9点30分，开会；2026-10-20 14:05，汇报。时间需与完整日期一起输入，采用24小时制。同日未注明时间的记录排在具体时刻之前，不视作零点。使用本地规则解析。</p><button id="generate">生成时间线 ↗</button><p id="status" role="status"></p><h2>02 / 调整与导出</h2><div class="controls"><select id="theme" aria-label="颜色"><option value="sage">学术绿</option><option value="blue">极简蓝</option><option value="terracotta">杂志橙</option></select><select id="layout" aria-label="样式"><option value="1">样式1</option><option value="2">样式2</option><option value="3">样式3</option><option value="4">样式4</option></select><button id="png" class="secondary">导出 PNG</button><button id="json" class="secondary">导出 JSON</button></div><div id="editor"></div></aside><article><div class="preview-label">实时预览 <span id="count"></span></div><div id="preview"></div></article></div><footer>你的文本只在当前浏览器处理 · 可编辑事件后再导出</footer></main><script src="app.js"></script></body></html>
