<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>岛田庄司小说系列发表顺序</title>
    <!-- 导入你的 CSS 样式文件 -->
    

<style>:root {
            --mitarai-color: #2c3e50; /* 御手洗系列：深蓝色 */
            --yoshiki-color: #27ae60; /* 吉敷系列：墨绿色 */
            --accent-color: #e74c3c;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #7f8c8d;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--text-main);
            margin-bottom: 40px;
            font-size: 2.2rem;
        }

        /* 时间轴样式设计 */
        .timeline-container {
            position: relative;
            padding-left: 20px;
        }

        /* 隐藏的垂直线（可选，为了增加时间轴的视觉引导） */
        .timeline-container::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background-color: var(--border-color);
            border-radius: 2px;
        }

        .book-card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        /* 时间轴节点的小圆点 */
        .book-card::before {
            content: '';
            position: absolute;
            left: -24px; /* 定位到主时间轴线上 */
            top: 15px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: inherit;
        }

        .book-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .card-header {
            color: white;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .card-body {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .edition-col {
            padding-right: 15px;
            border-right: 1px dashed var(--border-color);
        }
        
        .edition-col:last-child {
            border-right: none;
            padding-right: 0;
        }

        .edition-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 4px;
        }

        .edition-date {
            font-size: 0.8rem;
            color: #95a5a6;
            font-family: monospace;
        }

        .book-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-main);
            margin: 10px 0;
        }

        .note-badge {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
            vertical-align: middle;
            font-weight: normal;
        }

        .story-list-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 10px;
            margin-bottom: 4px;
        }

        .story-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            font-size: 0.9rem;
            color: #555;
        }

        .story-list li {
            position: relative;
            padding-left: 15px;
            margin-bottom: 4px;
        }

        .story-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--text-muted);
        }

        /* 手机端响应式 */
        @media (max-width: 768px) {
            .card-body {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            .edition-col {
                border-right: none;
                border-bottom: 1px dashed var(--border-color);
                padding-right: 0;
                padding-bottom: 15px;
            }
            .edition-col:last-child {
                border-bottom: none;
                padding-bottom: 0;
            }
        }

<body>

<div class="container">
<a class="site-return-link" href="/notes/">← 返回杂谈</a>

    <header class="archive-hero"><div class="archive-heading"><p>SHIMADA ARCHIVE</p><h1>岛田庄司小说发表时间轴</h1><small>御手洗洁和吉敷竹史两大系列<br>按日文首版日期排序 · 对照日文、繁中和简中版本</small></div><div class="archive-colors" aria-hidden="true"></div></header>
    <div class="timeline-container" id="timeline-container"></div>
</div>

<!-- 1. 导入你的书籍数据文件 -->
<script src="data.js"></script>

<!-- 2. 执行渲染逻辑 -->
<script>
    function parseDateForSort(dateStr) {
        if (!dateStr || dateStr === "待定") return 999999;
        const parts = dateStr.split('.');
        const year = parseInt(parts[0], 10);
        const month = parseInt(parts[1] || 1, 10);
        return year * 100 + month;
    }

    // 按日文首版时间排序
    allBooksData.sort((a, b) => parseDateForSort(a.jp.date) - parseDateForSort(b.jp.date));

    function renderTimeline(data, containerId) {
        const container = document.getElementById(containerId);
        let html = '';

        data.forEach(book => {
            const seriesInfo = seriesConfig[book.series];
            const noteBadge = book.note ? `<span class="note-badge">${book.note}</span>` : '';
            
            const generateList = (stories) => {
                if (!stories || stories.length === 0) return '';
                return `<div class="story-list-title">收录作品：</div>
                        <ul class="story-list">` + 
                       stories.map(story => `<li>${story}</li>`).join('') + 
                       `</ul>`;
            };

            const formatDate = (date) => date || '';

            html += `
            <div class="book-card" data-series="${book.series}">
                <div class="card-header" style="background-color: ${seriesInfo.color};">
                    ${seriesInfo.name}
                </div>
                <div class="card-body">
                    <div class="edition-col">
                        <div class="edition-label">
                            <span>日文版</span>
                            <span class="edition-date">${formatDate(book.jp.date)}</span>
                        </div>
                        <h3 class="book-title">${book.jp.title || ''} ${noteBadge}</h3>
                        ${generateList(book.jp.stories)}
                    </div>
                    
                    <div class="edition-col">
                        <div class="edition-label">
                            <span>繁中版</span>
                            <span class="edition-date">${formatDate(book.tc.date)}</span>
                        </div>
                        <h3 class="book-title">${book.tc.title === '暂未出版' ? '' : (book.tc.title || '')}</h3>
                        ${generateList(book.tc.stories)}
                    </div>
                    
                    <div class="edition-col">
                        <div class="edition-label">
                            <span>简中版</span>
                            <span class="edition-date">${formatDate(book.sc.date)}</span>
                        </div>
                        <h3 class="book-title">${book.sc.title === '暂未出版' ? '' : (book.sc.title || '')}</h3>
                        ${generateList(book.sc.stories)}
                    </div>
                </div>
            </div>
            `;
        });

        container.innerHTML = html;
    }

    renderTimeline(allBooksData, 'timeline-container');
</script>

</body>
</html>
