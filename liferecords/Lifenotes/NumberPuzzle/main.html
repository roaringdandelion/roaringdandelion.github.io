- 1)); \r\n    let isEditing = false; \r\n    let isWallLocked = false; \r\n\r\n    function initGame(fromEdit = false) {\r\n        clearInterval(timerInterval);\r\n        isEditing = false;\r\n        moves = 0; seconds = 0; isGameActive = false; history = [];\r\n        document.getElementById('moves').innerText = 0;\r\n        document.getElementById('timer').innerText = 0;\r\n        document.getElementById('edit-btn').innerText = \"设置固定块位置\";\r\n        document.getElementById('mode-text').innerText = \"\";\r\n        document.getElementById('board').classList.remove('editing');\r\n        \r\n        // 如果是正常洗牌且没有锁定墙，则随机生成新墙位置（避开最后一个空格位）\r\n        if (!fromEdit && !isWallLocked) {\r\n            fixedIdx = Math.floor(Math.random() * (size * size - 1));\r\n        }\r\n\r\n        // 核心修改：生成标准的 数组 数组\r\n        tiles = [...goalState];\r\n\r\n        // 模拟洗牌，打乱过程中通过核心约束避开固定块位置\r\n        shuffleSolvable();\r\n        render();\r\n    }\r\n\r\n    // 从终点出发洗牌，确保 100% 可解\r\n    function shuffleSolvable() {\r\n        let count = 0;\r\n        let emptyIdx = tiles.indexOf(0);\r\n        while (count \u003c 800) {\r\n            // 获取可用的邻居，这里包含了固定块的物理阻断\r\n            const adj = getValidNeighbors(emptyIdx);\r\n            const moveIdx = adj[Math.floor(Math.random() * adj.length)];\r\n            \r\n            // 交换空格和目标，完成一步合法移动\r\n            [tiles[emptyIdx], tiles[moveIdx]] = [tiles[moveIdx], tiles[emptyIdx]];\r\n            emptyIdx = moveIdx;\r\n            count++;\r\n        }\r\n    }\r\n\r\n    // 获取空格周围可以移动的索引 (核心逻辑：避开边界和固定块位置)\r\n    function getValidNeighbors(idx) {\r\n        const r = Math.floor(idx / size), c = idx % size;\r\n        const neighbors = [];\r\n        for (let [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {\r\n            const nr = r + dr, nc = c + dc;\r\n            if (nr >= 0 && nr \u003c size && nc >= 0 && nc \u003c size) {\r\n                const nIdx = nr * size + nc;\r\n                // 关键：不能移动固定块位置\r\n                if (nIdx !== fixedIdx) {\r\n                    neighbors.push(nIdx);\r\n                }\r\n            }\r\n        }\r\n        return neighbors;\r\n    }\r\n\r\n    function render() {\r\n        if (isEditing) return;\r\n        const board = document.getElementById('board');\r\n        board.innerHTML = '';\r\n        tiles.forEach((tile, index) => {\r\n            const div = document.createElement('div');\r\n            div.className = 'tile';\r\n            \r\n            if (tile === 0) {\r\n                div.classList.add('empty');\r\n                div.innerText = '';\r\n            } else {\r\n                div.innerText = tile;\r\n                if (tile === goalState[index]) div.classList.add('correct');\r\n                \r\n                // 核心修改：如果是固定块所在位置，显示它本身的数字，但加上固定块样式\r\n                if (index === fixedIdx) {\r\n                    div.classList.add('fixed');\r\n                    // 没有 onclick\r\n                } else {\r\n                    div.onclick = () => moveTile(index);\r\n                }\r\n            }\r\n            board.appendChild(div);\r\n        });\r\n        document.getElementById('undo-btn').disabled = (history.length === 0);\r\n    }\r\n\r\n    function toggleEditMode() {\r\n        if (!isEditing) {\r\n            isEditing = true;\r\n            isGameActive = false;\r\n            clearInterval(timerInterval);\r\n            document.getElementById('edit-btn').innerText = \"生成谜题\";\r\n            document.getElementById('mode-text').innerText = \"请点击格子选择固定块的位置...\";\r\n            document.getElementById('board').classList.add('editing');\r\n            renderEditor();\r\n        } else {\r\n            initGame(true);\r\n        }\r\n    }\r\n\r\n    // 锁定位置功能保留\r\n    function toggleWallLock() {\r\n        isWallLocked = !isWallLocked;\r\n        const lockBtn = document.getElementById('lock-wall-btn');\r\n        if (isWallLocked) {\r\n            lockBtn.innerText = \"锁定固定块位置: 开\";\r\n            lockBtn.style.background = \"#e67e22\"; \r\n        } else {\r\n            lockBtn.innerText = \"锁定固定块位置: 关\";\r\n            lockBtn.style.background = \"#95a5a6\"; \r\n        }\r\n    }\r\n\r\n    function renderEditor() {\r\n        const board = document.getElementById('board');\r\n        board.innerHTML = '';\r\n        for (let i = 0; i \u003c size * size; i++) {\r\n            const div = document.createElement('div');\r\n            // 编辑模式下显示终点状态的数字，让用户知道选择哪个数字固定\r\n            const tileVal = (i + 1) % (size * size);\r\n            \r\n            div.className = 'tile' + (i === fixedIdx ? ' fixed' : '');\r\n            if(tileVal === 0) {\r\n                div.classList.add('empty');\r\n                div.innerText = '';\r\n            } else {\r\n                div.innerText = tileVal;\r\n            }\r\n            \r\n            div.onclick = () => {\r\n                if (tileVal === 0) return; fixedIdx = i;\r\n                renderEditor();\r\n            };\r\n            board.appendChild(div);\r\n        }\r\n    }\r\n\r\n    function moveTile(index) {\r\n        if (isEditing) return;\r\n        const emptyIdx = tiles.indexOf(0);\r\n        // 除了相邻，还必须不能点击那个固定的位置\r\n        if (isAdjacent(index, emptyIdx) && index !== fixedIdx) {\r\n            if (moves === 0) { startTimer(); isGameActive = true; }\r\n            history.push([...tiles]);\r\n            [tiles[index], tiles[emptyIdx]] = [tiles[emptyIdx], tiles[index]];\r\n            moves++;\r\n            document.getElementById('moves').innerText = moves;\r\n            render();\r\n            checkWin();\r\n        }\r\n    }\r\n\r\n    function undoMove() {\r\n        if (history.length > 0) {\r\n            tiles = history.pop();\r\n            moves--;\r\n            document.getElementById('moves').innerText = moves;\r\n            render();\r\n        }\r\n    }\r\n\r\n    function isAdjacent(i1, i2) {\r\n        const r1 = Math.floor(i1/size), c1 = i1%size, r2 = Math.floor(i2/size), c2 = i2%size;\r\n        return Math.abs(r1-r2) + Math.abs(c1-c2) === 1;\r\n    }\r\n\r\n    function startTimer() {\r\n        timerInterval = setInterval(() => {\r\n            seconds++;\r\n            document.getElementById('timer').innerText = seconds;\r\n        }, 1000);\r\n    }\r\n\r\n    function checkWin() {\r\n        const isWin = tiles.every((val, index) => val === goalState[index]);\r\n        if (isWin && isGameActive) {\r\n            clearInterval(timerInterval);\r\n            isGameActive = false;\r\n            document.getElementById('win-text').innerText = `步数：${moves}\\n耗时：${seconds}秒`;\r\n            document.getElementById('win-modal').style.display = 'flex';\r\n        }\r\n    }\r\n\r\n    function closeWinModal() {\r\n        document.getElementById('win-modal').style.display = 'none';\r\n        initGame();\r\n    }\r\n\r\n    initGame();\r\n\u003c/script>\r\n\u003c/body>\r\n\u003c/html>\r\n","\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>数字拼图\u003c/title>\u003cstyle>\n* { box-sizing:border-box }\nbody { margin:0; padding:12px; background:#fcfbf7; color:#111; font-family:system-ui,sans-serif }\nmain { width:min(100%,390px); margin:auto; text-align:center }\n.stats { display:flex; justify-content:center; gap:30px; margin-bottom:15px; border:3px solid #111; padding:8px; background:#0045c8; color:white; font-size:1.2rem; font-weight:700 }\n.controls { display:flex; justify-content:center; gap:10px; margin-top:25px }\n.controls button { border:2px solid #111; padding:7px 10px; background:#0045c8; color:white; font:inherit; cursor:pointer }\n.controls button:disabled { background:#e3e0d5; color:#555; cursor:default }\n#board { position:relative; display:grid; width:max-content; margin:auto; grid-template-columns:repeat(6,var(--cell-size)); grid-template-rows:repeat(6,var(--cell-size)); gap:0; }\n#board .slot { display:block; min-width:0; min-height:0; }\n#board button { display:block; width:100%; height:100%; margin:0; min-width:0; min-height:0; padding:0; border:0; background:#efede2; color:#111; font:900 clamp(13px,4.5vw,27px)/1 system-ui }\n#board svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }\n#board button:focus-visible { outline:2px solid #0045c8; outline-offset:-4px }\n#board button:not(:disabled) { cursor:pointer }\n#board .correct { background:#ffdb00 }\n#board .empty { background:#111 }\n#win-dialog { border:4px solid #111; background:#fcfbf7; color:#111; text-align:center; width:min(320px,90vw); }\n#win-dialog::backdrop { background:#1119 }\n#win-dialog button { border:2px solid #111; padding:8px 16px; background:#ffdb00; font:inherit; font-weight:700; cursor:pointer }\n\u003c/style>\u003cmain>\u003cdiv class=\"stats\">\u003cspan>步数: \u003cspan id=\"move-count\">0\u003c/span>\u003c/span>\u003cspan>时间: \u003cspan id=\"timer\">0\u003c/span>s\u003c/span>\u003c/div>\u003cdiv id=\"board\" aria-label=\"异形棋盘\">\u003c/div>\u003cdiv class=\"controls\">\u003cbutton id=\"undo\">撤销\u003c/button>\u003cbutton id=\"shuffle\">洗牌\u003c/button>\u003c/div>\u003cp id=\"result\" role=\"status\" hidden>已完成\u003c/p>\u003c/main>\u003cdialog id=\"win-dialog\">\u003ch2>恭喜通关！\u003c/h2>\u003cp id=\"win-details\">\u003c/p>\u003cbutton id=\"play-again\">再来一局\u003c/button>\u003c/dialog>\n\u003cscript>(function playShape(rows) {\n  const board = document.querySelector('#board');\n  const moveCount = document.querySelector('#move-count');\n  const timer = document.querySelector('#timer');\n  const result = document.querySelector('#result');\n  const winDialog = document.querySelector('#win-dialog');\n  const winDetails = document.querySelector('#win-details');\n  const undo = document.querySelector('#undo');\n  const cells = rows.flatMap((row, y) =>\n    [...row].flatMap((cell, x) => cell === '#' ? [{ x, y }] : []));\n  const neighbors = cells.map(({ x, y }) => cells.flatMap((cell, index) =>\n    Math.abs(cell.x - x) + Math.abs(cell.y - y) === 1 ? [index] : []));\n  const goal = cells.map((_, i) => i + 1 \u003c cells.length ? i + 1 : 0);\n  const main = document.querySelector('main');\n  const resizeBoard = () => {\n    board.style.setProperty('--cell-size', Math.floor(main.clientWidth / rows[0].length) + 'px');\n  };\n  new ResizeObserver(resizeBoard).observe(main);\n  resizeBoard();\n  // Build the full rectangular grid before removing cells outside the shape.\n  const slots = rows.map(row => [...row].map(() => {\n    const slot = document.createElement('span');\n    slot.className = 'slot';\n    board.append(slot);\n    return slot;\n  }));\n  const history = [];\n  let tiles, empty, startedAt, interval;\n\n  function updateTime() {\n    timer.textContent = Math.floor((performance.now() - startedAt) / 1000);\n  }\n\n  function stopTimer() {\n    clearInterval(interval);\n    interval = null;\n  }\n\n  function swap(index) {\n    [tiles[empty], tiles[index]] = [tiles[index], tiles[empty]];\n    empty = index;\n  }\n\n  function solved() {\n    return tiles.every((tile, index) => tile === goal[index]);\n  }\n\n  const buttons = cells.map(({ x, y }, index) => {\n    const button = document.createElement('button');\n    button.type = 'button';\n    button.onclick = () => {\n      if (solved() || !neighbors[empty].includes(index)) return;\n      if (startedAt === null) {\n        startedAt = performance.now();\n        interval = setInterval(updateTime, 250);\n      }\n      history.push(empty);\n      swap(index);\n      if (solved()) {\n        updateTime();\n        stopTimer();\n      }\n      draw();\n      if (solved()) {\n        winDetails.textContent = `步数：${history.length} · 用时：${timer.textContent} 秒`;\n        winDialog.showModal();\n      }\n    };\n    slots[y][x].append(button);\n    return button;\n  });\n  rows.forEach((row, y) => [...row].forEach((cell, x) => {\n    if (cell === '#') return;\n    slots[y][x].remove();\n  }));\n  cells.forEach(({ x, y }) => {\n    slots[y][x].style.gridArea = (y + 1) + ' / ' + (x + 1);\n  });\n  const lines = cells.flatMap(({ x, y }) => [\n    `M ${x} ${y} H ${x + 1}`,\n    `M ${x} ${y} V ${y + 1}`,\n    rows[y][x + 1] === '#' ? '' : `M ${x + 1} ${y} V ${y + 1}`,\n    rows[y + 1]?.[x] === '#' ? '' : `M ${x} ${y + 1} H ${x + 1}`,\n  ]).filter(Boolean).join(' ');\n  const outline = document.createElementNS('http://www.w3.org/2000/svg', 'svg');\n  outline.setAttribute('viewBox', `0 0 ${rows[0].length} ${rows.length}`);\n  outline.setAttribute('aria-hidden', 'true');\n  outline.innerHTML = `\u003cpath d=\"${lines}\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"/>`;\n  board.append(outline);\n\n\n  function draw() {\n    const complete = solved();\n    buttons.forEach((button, i) => {\n      const number = tiles[i];\n      button.textContent = number || '';\n      button.className = number ? (number === goal[i] ? 'correct' : '') : 'empty';\n      button.setAttribute('aria-label', number ? '数字 ' + number : '空格');\n      button.disabled = complete || !neighbors[empty].includes(i);\n    });\n    moveCount.textContent = history.length;\n    undo.disabled = complete || history.length === 0;\n    result.hidden = !complete;\n  }\n\n  function start() {\n    stopTimer();\n    startedAt = null;\n    timer.textContent = 0;\n    history.length = 0;\n    tiles = [...goal];\n    empty = tiles.length - 1;\n    let previous = -1;\n    for (let i = 0; i \u003c cells.length * 12 || solved(); i += 1) {\n      const options = neighbors[empty].filter(index => index !== previous);\n      previous = empty;\n      swap(options[Math.floor(Math.random() * options.length)]);\n    }\n    draw();\n  }\n\n  undo.onclick = () => {\n    if (undo.disabled) return;\n    swap(history.pop());\n    draw();\n  };\n  document.querySelector('#shuffle').onclick = start;\n  document.querySelector('#play-again').onclick = () => {\n function draw() {\n    const complete = solved();\n    buttons.forEach((button, i) => {\n      const number = tiles[i];\n      button.textContent = number || '';\n      button.className = number ? (number === goal[i] ? 'correct' : '') : 'empty';\n      button.setAttribute('aria-label', number ? '数字 ' + number : '空格');\n      button.disabled = complete || !neighbors[empty].includes(i);\n    });\n    moveCount.textContent = history.length;\n    undo.disabled = complete || history.length === 0;\n    result.hidden = !complete;\n  }\n\n  function start() {\n    stopTimer();\n    startedAt = null;\n    timer.textContent = 0;\n    history.length = 0;\n    tiles = [...goal];\n    empty = tiles.length - 1;\n    let previous = -1;\n    for (let i = 0; i \u003c cells.length * 12 || solved(); i += 1) {\n      const options = neighbors[empty].filter(index => index !== previous);\n      previous = empty;\n      swap(options[Math.floor(Math.random() * options.length)]);\n    }\n    draw();\n  }\n\n  undo.onclick = () => {\n    if (undo.disabled) return;\n    swap(history.pop());\n    draw();\n  };\n  document.querySelector('#shuffle').onclick = start;\n  document.querySelector('#play-again').onclick = () => {\n    winDialog.close();\n    start();\n  };\n  start();\n})([\".##..##.\",\"########\",\"########\",\".######.\",\"..####..\",\"...##...\"]);\u003c/script>\u003c/html>"];const game=document.querySelector('#game');let observer;
