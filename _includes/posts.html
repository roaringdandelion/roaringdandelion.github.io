<div class="entry-list">{% for post in site.posts limit:include.limit %}<a class="note-entry" href="{{ post.url | relative_url }}"><time>{{ post.date | date: '%Y.%m.%d' }}</time><h2>{{ post.title | escape }}</h2><p>{{ post.description | default: post.excerpt | strip_html | truncate: 140 | escape }}</p></a>{% else %}<div class="empty"><p>还没有发表杂谈，等一个想写下来的念头。</p></div>{% endfor %}</div>
